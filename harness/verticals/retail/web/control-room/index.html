<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rocoto · Cameras</title><link rel="icon" href="kit/rocoto-mark.svg" type="image/svg+xml"><meta name="description" content="Follow a person’s journey through the camera recording."><link href="kit/rocoto-kit.css" rel="stylesheet"><link href="style.css" rel="stylesheet"><link href="kit/twelvelabs-material.css" rel="stylesheet"><link href="location-view.css" rel="stylesheet"><link href="/display-charts.css" rel="stylesheet"><link href="home-history.css" rel="stylesheet"><link href="weather-widget.css" rel="stylesheet"><link href="control-room.css" rel="stylesheet"></head><body>
<header class="watch-header"><button id="locationBack" class="location-back" aria-label="Back to location overview" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 5-7 7 7 7"/></svg></button><a class="brand" href="#" aria-label="Rocoto cameras"><span class="rocoto-mark" aria-hidden="true"></span><span>Rocoto</span></a><div id="headerWeather"></div></header><div id="locationRoot" hidden></div>
<main><section id="compare" class="panel active"><div id="pendingPrimary" hidden><p>Loading recordings…</p></div><div id="benchmarkWorkspace" class="workspace" hidden><div class="footage">
<div class="camera-player" tabindex="0" aria-label="Camera player">
<div class="video-wrap" aria-label="Select a person in the camera view">
<video id="video" playsinline preload="auto"></video><div class="media-loading" id="mediaLoading" role="status" hidden>Loading recording…</div><canvas id="personOutline" class="person-outline" aria-hidden="true"></canvas><svg aria-hidden="true" id="trackOverlay" viewBox="0 0 1920 1080"></svg><div id="trailAnnotations" class="trail-annotations"></div><div id="contextualActivity" class="contextual-activity twelvelabs-card-material" hidden></div>
<span id="clock" hidden></span>
<div aria-live="off" class="event-overlay" id="eventOverlay"></div>
<aside aria-label="Selected action evidence" class="evidence-thumbnail" hidden id="evidenceThumbnail"><button aria-label="Close snapshot" class="evidence-thumb-close" id="evidenceThumbClose">×</button><button id="evidenceThumbOpen"><img alt="Original camera evidence for selected action" id="evidenceThumbImage"><span id="evidenceThumbCaption"></span></button></aside>
<div aria-hidden="true" class="reference-on-video" id="referenceOverlay"></div>
<button id="catchupButton" class="catchup-overlay" hidden>Catch up</button>
<div class="timeline-dock"><div class="seek-preview" id="seekPreview" hidden><div id="seekPreviewImage"></div><strong id="seekPreviewLabel"></strong><time id="seekPreviewTime"></time></div>
<div id="durationLayers" class="duration-layers" aria-label="Selected person durations"></div>
<div id="mainSeek" class="main-seek" role="slider" aria-label="Seek video" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0" tabindex="0"><div class="seek-base"></div><div class="seek-buffer" id="seekBuffer"></div><div class="seek-progress" id="seekProgress"></div><div class="seek-chapters" id="seekChapters"></div><span class="seek-knob" id="seekKnob"></span></div>
</div>
<div id="keyFeedback" class="key-feedback" hidden></div>
</div>
<div class="player-controls" id="playerControls">
<div hidden><button id="liveReplayButton" aria-pressed="true">Live replay</button><span id="liveReplayTime"></span></div>
<div class="control-row"><div class="controls-left"><button class="rocoto-kit-icon-button control-circle" id="playToggle" aria-label="Play (k)"><span data-icon="play"></span></button><button class="rocoto-kit-icon-button control-circle next-control" id="nextChapter" aria-label="Next chapter"><span data-icon="next"></span></button><div class="volume-control"><button class="rocoto-kit-icon-button control-circle" id="muteToggle" aria-label="Mute (m)"><span data-icon="volume"></span></button><input id="volumeSlider" aria-label="Volume" type="range" min="0" max="1" step="0.05" value="1"></div><div class="time-chapter"><span id="playerTime">0:00 / 2:00</span><details class="room-switcher"><summary aria-label="Choose a room"><span id="activeRoomName">Shop aisle</span><span data-icon="chevron"></span></summary><div class="room-tray"><label for="roomSelect" class="visually-hidden">Room</label><select id="roomSelect"><option value="shop-aisle">Shop aisle</option></select><div id="primarySelection" class="primary-selection"><div id="clipGrid" class="clip-grid"></div><p class="room-demo-note">Recorded replay</p></div></div></details><button id="currentChapter" aria-label="Open person activity" hidden>Journey <span data-icon="chevron"></span></button></div></div><div class="controls-right"><button id="captionToggle" class="rocoto-kit-icon-button control-circle" aria-label="Toggle event captions (c)" aria-pressed="true"><span data-icon="captions"></span></button><button id="settingsToggle" class="rocoto-kit-icon-button control-circle" aria-label="Playback settings" aria-expanded="false"><span data-icon="settings"></span></button><button id="theaterToggle" class="rocoto-kit-icon-button control-circle theater-control" aria-label="Theater mode (t)"><span data-icon="theater"></span></button><button id="expandPlayback" class="rocoto-kit-icon-button control-circle" aria-label="Full screen (f)"><span data-icon="fullscreen"></span></button></div></div>
</div>
<div class="player-settings" id="playerSettings" hidden><label>Playback speed <select id="playbackSpeed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>Normal</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label title="Recorded 2D camera-view path since first observed in this excerpt">Camera-view path <input id="trailSetting" type="checkbox" checked></label><label>Person outline <input id="outlineSetting" type="checkbox" aria-describedby="outlineStatus"></label><span id="outlineStatus" class="outline-note" role="status" hidden></span><label>Loop recording <input id="loopSetting" type="checkbox" checked></label><label>Model <select id="overlayModel"><option value="8b" selected>Cosmos 8B</option><option value="dataset_reference">Dataset annotations · evaluation reference</option><option value="2b">Cosmos 2B</option></select></label><a class="source-credit" href="https://huggingface.co/datasets/Intel/Video_Summarization_For_Retail" target="_blank" rel="noopener">Retail footage · Intel · CC BY-SA 4.0</a></div>
</div>

<section class="person-journey chapter-strip" id="personJourney" aria-label="Selected visitor chapters"></section>
<p class="media-error" id="mediaError" hidden></p><div class="watch-title" hidden><h1 id="clipTitle">Loading recording…</h1><div class="watch-actions"><button id="downloadEvents" class="rocoto-kit-icon-button plain-icon" aria-label="Export observations" title="Export observations"><span data-icon="download"></span></button><button id="reopenJourney" class="rocoto-kit-icon-button plain-icon" aria-label="Open chapters" title="Open chapters"><span data-icon="chapters"></span></button></div></div>

</div><aside class="recording-playlist"><section class="journey-panel" id="journeyPanel">
<div id="visitorList" class="visitor-list" hidden></div>
<div id="visitorDetail" class="visitor-detail">
<div class="journey-panel-heading"><button id="visitorBack" class="rocoto-kit-icon-button plain-icon" aria-label="All visitors"><span data-icon="chevronLeft"></span></button><h2 id="personHeading">Visitor</h2><div class="person-navigation"><button id="previousPerson" class="rocoto-kit-icon-button plain-icon" aria-label="Previous visitor"><span data-icon="chevronLeft"></span></button><button id="nextPerson" class="rocoto-kit-icon-button plain-icon" aria-label="Next visitor"><span data-icon="chevron"></span></button><button id="closeJourney" class="rocoto-kit-icon-button plain-icon" aria-label="Close visitor details" hidden><span data-icon="close"></span></button></div></div>
<nav class="journey-tabs" id="journeyTabs" aria-label="Visitor details"><button class="selected" data-journey-tab="summary">Summary</button><button data-journey-tab="notes">Notes</button></nav>
<div class="visitor-information"><section class="person-summary" id="personSummary"></section>
<section class="visitor-items" id="visitorItems" aria-label="Observed items"></section>
<section class="visit-basket" id="visitBasket" aria-label="Visitor basket estimate" hidden></section></div>
</div></section></aside></div></section></main>
<div hidden><input id="trackTimes" type="checkbox" checked><input id="trackTrails" type="checkbox" checked><input id="overlays" type="checkbox" checked><input id="loop" type="checkbox" checked><input id="referenceChecks" type="checkbox"><input id="playhead" type="range"><output id="playheadTime"></output></div>
<dialog class="evidence-dialog" id="evidenceDialog"><div class="section-heading"><h2 id="evidenceTitle">Source image</h2><button class="button secondary" id="evidenceClose">Close</button></div><p class="small" id="evidenceMeta"></p><img alt="Original camera evidence" id="evidenceImage"/><p id="evidenceDescription"></p><div class="evidence-actions"><button class="button secondary" id="evidenceFullView">Full frame</button><button class="button secondary" hidden="" id="evidencePersonView">Person view</button><button class="button secondary" hidden id="evidenceObjectView">Object view</button><a id="evidenceOriginalLink" rel="noopener" target="_blank">Open original frame ↗</a></div></dialog>
<script src="journey-model.js"></script><script src="room-loop.js"></script><script src="motion-timeline.js"></script><script src="person-outline.js"></script><script src="location-data.js"></script><script src="/display-charts.js"></script><script src="home-history.js"></script><script src="home-model.js"></script><script src="home-marks.js"></script><script src="location-view.js"></script><script src="weather-widget.js"></script><script src="control-room.js"></script><script src="visit-basket.js"></script><script src="player-lifecycle.js"></script><script src="maintained-player.js"></script>
<script src="app.js"></script></body></html>
